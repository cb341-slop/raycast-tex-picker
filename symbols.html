<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f7">
  <title>TeX Symbols</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232b2d31'/%3E%3Ctext x='32' y='45' text-anchor='middle' font-family='serif' font-size='43' fill='white'%3E%CE%A3%3C/text%3E%3C/svg%3E">
  <style>
    :root { color-scheme: light; --ink:#242528; --muted:#898b90; --line:#dedfe2; --tile:#ececee; --accent:#3978ee; --surface:rgba(255,255,255,.84); }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; background:radial-gradient(ellipse at 50% -12%,#fff 0,#f4f4f5 60%,#ededf0 100%); color:var(--ink); font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .picker { width:min(1120px,calc(100% - 48px)); margin:26px auto; overflow:hidden; border:1px solid #d3d4d7; border-radius:24px; background:var(--surface); box-shadow:0 22px 70px #2222; backdrop-filter:blur(22px); }
    .toolbar { display:flex; align-items:center; gap:14px; padding:18px 22px; border-bottom:1px solid var(--line); position:sticky; top:0; z-index:3; background:#f8f8f8ed; backdrop-filter:blur(20px); }
    .mark { display:grid; place-items:center; flex:none; width:40px;height:40px;border-radius:12px;background:#e7e7e9;font:28px Georgia,serif; }
    #search { flex:1; min-width:100px; border:0; outline:0; background:transparent; font:inherit; font-size:24px; letter-spacing:-.03em; color:var(--ink); }
    #search::placeholder { color:#999a9d }
    select { width:190px; padding:11px 14px; border:1px solid #c9cace; border-radius:13px; background:#fff9; color:var(--ink); font:inherit; font-size:16px; }
    .content { padding:22px 22px 30px; max-height:calc(100vh - 125px); overflow:auto; }
    .intro { display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin:0 0 22px; }
    .intro h1 { font-size:14px; font-weight:500; color:var(--muted); margin:0; }
    .hint { font-size:12px; color:#999; }
    .section { margin:0 0 28px; }
    .section-head { display:flex; align-items:baseline; gap:14px; margin:0 0 12px; }
    .section-head h2 { margin:0; font-size:19px; font-weight:600; color:#64666a; }
    .count { color:#9b9ca0; font-size:16px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(118px,1fr)); gap:12px; }
    .card { min-width:0; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:126px; padding:12px 8px 10px; border:2px solid transparent; border-radius:15px; background:var(--tile); cursor:pointer; transition:background .15s,border-color .15s,transform .15s; }
    .card:hover { background:#e3e5e9; transform:translateY(-1px); }
    .card:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
    .glyph { height:62px; display:grid; place-items:center; font:42px/1 "Times New Roman",Georgia,serif; }
    .tex { margin-top:4px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font:12px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace; color:#65676b; }
    .name { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; font-size:11px; color:#999a9e; }
    .star { position:absolute; top:6px; right:7px; width:26px;height:26px; display:grid;place-items:center; border:0;border-radius:8px;background:transparent;color:#a2a3a6;font-size:17px;opacity:0;cursor:pointer; }
    .card:hover .star,.star:focus-visible,.star.saved { opacity:1; }
    .star.saved { color:#e1a800; }
    .empty { padding:38px 12px; text-align:center; color:#929398; }
    .toast { position:fixed; left:50%; bottom:24px; transform:translate(-50%,12px); padding:10px 16px; border-radius:12px; background:#242528; color:white; opacity:0; pointer-events:none; transition:.18s; box-shadow:0 6px 24px #0003; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    @media(max-width:760px) { .picker{width:100%;margin:0;border-radius:0;min-height:100vh}.toolbar{padding:12px;gap:8px;flex-wrap:wrap}.content{max-height:none;padding:18px 12px}.mark{width:34px;height:34px}#search{font-size:18px}select{width:auto;flex:1;padding:9px 8px;font-size:14px}.grid{grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}.card{min-height:108px}.glyph{height:50px;font-size:36px}.hint{display:none} }
  </style>
</head>
<body>

    <header class="toolbar">
      <div class="mark" aria-hidden="true">Σ</div>
      <input id="search" type="search" placeholder="Search symbols, names, or TeX…" autocomplete="off" aria-label="Search symbols">
      <select id="copy-format" aria-label="Copy format"><option value="unicode" selected>Copy: Unicode</option><option value="tex">Copy: TeX</option></select>
      <select id="category" aria-label="Filter category"><option value="All">All symbols</option></select>
    </header>
    <div class="content" id="content">
      <div class="intro"><h1>TeX Symbols · click a tile to copy its Unicode character</h1><span class="hint">Choose Unicode or TeX above · press / to search · ☆ saves favorites</span></div>
      <div id="sections"></div>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

const $ = (s) => document.querySelector(s);

for (const c of categories) { const option=document.createElement('option'); option.value=c; option.textContent=c; $('#category').append(option); }
const searchable = s => [s[0],s[1],s[2],s[3],s[4]].join(' ').toLowerCase();
function esc(v){ return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function render(){
  const q=$('#search').value.trim().toLowerCase(), selected=$('#category').value;
  let groups=[];
  if(selected==='All') groups=[['Frequently Used', symbols.filter(s=>favorites.has(s[1])).slice(0,16)], ...categories.slice(1).map(c=>[c,symbols.filter(s=>s[3]===c)])];
  else if(selected==='Favorites') groups=[['Favorites',symbols.filter(s=>favorites.has(s[1]))]];
  else groups=[[selected,symbols.filter(s=>s[3]===selected)]];
  groups=groups.map(([name,items])=>[name,items.filter(s=>!q||searchable(s).includes(q))]).filter(g=>g[1].length);
  if(q && selected==='All') { const seen=new Set(); groups=groups.map(([n,items])=>[n,items.filter(s=>{if(seen.has(s[1]))return false;seen.add(s[1]);return true;})]).filter(g=>g[1].length); }
  $('#sections').innerHTML=groups.length?groups.map(([name,items])=>`<section class="section"><div class="section-head"><h2>${esc(name)}</h2><span class="count">${items.length}</span></div><div class="grid">${items.map(s=>`<div class="card" tabindex="0" role="button" data-symbol="${esc(s[0])}" data-tex="${esc(s[1])}" aria-label="Copy ${esc(s[2])}"><button class="star ${favorites.has(s[1])?'saved':''}" data-fav="${esc(s[1])}" aria-label="${favorites.has(s[1])?'Remove from':'Add to'} favorites" title="Favorite">${favorites.has(s[1])?'★':'☆'}</button><span class="glyph">${esc(s[0])}</span><span class="tex">${esc(s[1])}</span><span class="name">${esc(s[2])}</span></div>`).join('')}</div></section>`).join(''):`<div class="empty">${selected==='Favorites'?'No favorites yet. Hover a symbol and click ☆ to save it.':'No matching symbols. Try a name, TeX command, or related word.'}</div>`;
}
async function copy(card){const format=$('#copy-format').value;const value=format==='unicode'?card.dataset.symbol:card.dataset.tex;try{await navigator.clipboard.writeText(value)}catch{const t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();document.execCommand('copy');t.remove()}const toast=$('#toast');toast.textContent=`Copied ${value}`;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
function copyCard(card){copy(card);}
$('#sections').addEventListener('click',e=>{const star=e.target.closest('[data-fav]');if(star){const k=star.dataset.fav;favorites.has(k)?favorites.delete(k):favorites.add(k);localStorage.setItem(savedKey,JSON.stringify([...favorites]));render();return}const card=e.target.closest('[data-symbol]');if(card)copyCard(card)});
$('#sections').addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card')){e.preventDefault();copyCard(e.target)}});
$('#search').addEventListener('input',render);$('#category').addEventListener('change',render);
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus()}if(e.key==='Escape'){$('#search').value='';$('#search').blur();render()}});
render();
